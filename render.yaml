databases:
  - name: agency-db
    plan: free
    databaseName: agency_system
    user: agency_user

services:
  # ─── NestJS API ─────────────────────────────────────────────────────────────
  - type: web
    name: agency-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build && npm run migration:run
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agency-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 4000
      - key: WEB_ORIGIN
        sync: false   # Set manually in Render dashboard after web service deploys

  # ─── Next.js Frontend ───────────────────────────────────────────────────────
  - type: web
    name: agency-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        sync: false   # Set manually: https://agency-api.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false   # Set manually: https://agency-web.onrender.com
